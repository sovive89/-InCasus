server {
  listen 80;
  server_tokens off;
  client_max_body_size 11m;
  add_header Access-Control-Allow-Origin '*' always;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
  add_header Access-Control-Allow-Headers 'Authorization, apikey, Content-Type, X-Client-Info, X-Upsert, X-Supabase-Api-Version, Prefer, Range, Accept-Profile, Content-Profile, Cache-Control' always;
  add_header Access-Control-Expose-Headers 'Content-Range, X-Total-Count' always;
  if ($request_method = OPTIONS) { return 204; }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Access-Control-Allow-Origin;
  }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_hide_header Access-Control-Allow-Origin;
  }
  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    proxy_set_header Host $http_host;
    proxy_hide_header Access-Control-Allow-Origin;
  }
  location / { return 404; }
}
